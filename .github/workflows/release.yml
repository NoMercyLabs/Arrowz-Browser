name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    # Creating the release and attaching the artifacts to it. Without this the
    # default token is read-only on repositories configured that way, and the
    # publish step fails after a successful build, which is the most annoying
    # place for a permission to be missing.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::NM_KEYSTORE_BASE64 is not set. See docs/release.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # Both, and signed with the same key. The AAB is what Play takes; the APK
      # is what somebody sideloads onto a television Play has not reached, and a
      # release that ships only the bundle leaves those people with nothing.
      - name: Build AAB and APK
        env:
          NM_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          NM_KEYSTORE_PASSWORD: ${{ secrets.NM_KEYSTORE_PASSWORD }}
          NM_KEY_ALIAS: ${{ secrets.NM_KEY_ALIAS }}
          NM_KEY_PASSWORD: ${{ secrets.NM_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      # Named for the version rather than "app-release", so a file sitting in
      # somebody's downloads folder still says what it is a year from now.
      - name: Name and checksum the artifacts
        id: artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="$(git rev-parse --short HEAD)"; fi
          mkdir -p release
          cp app/build/outputs/bundle/release/app-release.aab "release/arrowz-browser-$VERSION.aab"
          cp app/build/outputs/apk/release/app-release.apk "release/arrowz-browser-$VERSION.apk"
          cd release
          sha256sum ./*.aab ./*.apk | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: arrowz-browser-${{ steps.artifacts.outputs.version }}
          path: release/

      # A workflow artifact expires and needs a GitHub login to fetch. A release
      # asset does neither, which is what "downloadable" has to mean.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The section for this version, not whatever sits at the top of the
          # file: Unreleased is above it and says nothing.
          awk -v want="## [${GITHUB_REF_NAME#v}]" \
            'index($0, want) == 1 { inside = 1; next } /^## \[/ { inside = 0 } inside' \
            CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

          {
            cat notes.md
            echo
            echo '## Checksums'
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } > body.md

          gh release create "$GITHUB_REF_NAME" \
            --title "Arrowz Browser ${GITHUB_REF_NAME#v}" \
            --notes-file body.md \
            release/arrowz-browser-*.aab \
            release/arrowz-browser-*.apk \
            release/SHA256SUMS.txt

      # The secrets context is not available in a step-level if, so the check
      # has to become a step output. Using it directly makes GitHub reject the
      # whole workflow file, which shows up as a run with no jobs at all.
      - name: Is Play publishing configured
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No Play service account configured; skipping upload."
          fi

      # Publishing to the internal track only. Promotion to production stays a
      # manual decision in the Play Console, because a browser reaching every
      # Android TV device is not something a tag push should do on its own.
      - name: Publish to internal testing
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nomercylabs.arrowz
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
