name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    # Creating the release and attaching the artifacts to it. Without this the
    # default token is read-only on repositories configured that way, and the
    # publish step fails after a successful build, which is the most annoying
    # place for a permission to be missing.
    permissions:
      contents: write
    steps:
      # Tags included deliberately. The version step counts same-day tags to
      # decide whether today needs a suffix, and a default shallow checkout
      # fetches none of them, so the count was always zero and the second
      # release of a day collided with the first.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Nobody edits a version by hand. The name is the date, because that is
      # what a tester can read off an About screen and quote back to us, and the
      # code is the run number, which only ever increases.
      #
      # The +100 offset clears versionCodes 1 and 2, published by hand before
      # this step existed. Play requires the code to increase forever for one
      # applicationId, so this floor can never be lowered.
      #
      # A tag push keeps the tag's own name, so a deliberately named release
      # stays that name. Anything else gets today's date, suffixed when the day
      # already has one.
      - name: Decide the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            DATE=$(date +"%Y.%m.%d")
            SAME_DAY=$(git tag --list "v${DATE}*" | wc -l)
            NAME="$DATE"
            [ "$SAME_DAY" -gt 0 ] && NAME="${DATE}-$((SAME_DAY + 1))"
          fi
          CODE=$(( GITHUB_RUN_NUMBER + 100 ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME as versionCode $CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::NM_KEYSTORE_BASE64 is not set. See docs/release.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # Both, and signed with the same key. The AAB is what Play takes; the APK
      # is what somebody sideloads onto a television Play has not reached, and a
      # release that ships only the bundle leaves those people with nothing.
      - name: Build AAB and APK
        env:
          NM_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          NM_KEYSTORE_PASSWORD: ${{ secrets.NM_KEYSTORE_PASSWORD }}
          NM_KEY_ALIAS: ${{ secrets.NM_KEY_ALIAS }}
          NM_KEY_PASSWORD: ${{ secrets.NM_KEY_PASSWORD }}
          NM_VERSION_NAME: ${{ steps.version.outputs.name }}
          NM_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew bundleRelease assembleRelease

      # Named for the version rather than "app-release", so a file sitting in
      # somebody's downloads folder still says what it is a year from now.
      - name: Name and checksum the artifacts
        id: artifacts
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          mkdir -p release
          cp app/build/outputs/bundle/release/app-release.aab "release/arrowz-browser-$VERSION.aab"
          cp app/build/outputs/apk/release/app-release.apk "release/arrowz-browser-$VERSION.apk"
          cd release
          sha256sum ./*.aab ./*.apk | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Play warns that the bundle carries native code with no symbols. It is
      # right: the only .so here is libandroidx.graphics.path.so, which Compose
      # brings in transitively and which ships stripped, so debugSymbolLevel has
      # nothing to embed. The stripped libraries still carry a dynamic symbol
      # table, which is enough for Play to turn addresses in a native crash into
      # exported function names. Partial symbolication rather than none.
      #
      # Google wants them laid out as <abi>/<lib>.so inside a zip.
      - name: Collect native debug symbols
        id: symbols
        run: |
          SRC=$(find app/build/intermediates/merged_native_libs/release -type d -name lib | head -n1)
          if [ -z "$SRC" ]; then
            echo "::warning title=No native symbols::No merged native libraries were found, so a native crash on this release will report bare addresses."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${{ steps.version.outputs.name }}"
          mkdir -p symbols && cp -r "$SRC"/* symbols/
          find symbols -name '*.so' -printf '  %p (%s bytes)\n'
          # -i '*.so': Play accepts <abi>/<lib>.so and nothing else, so anything
          # else the intermediates directory happens to hold stays out.
          (cd symbols && zip -q9r "../release/native-debug-symbols-$VERSION.zip" . -i '*.so')
          echo "path=release/native-debug-symbols-$VERSION.zip" >> "$GITHUB_OUTPUT"

          # The mapping is the half that makes a Java stack trace readable, and
          # it is attached rather than left as a workflow artifact: artifacts
          # expire and need a login, and this is the file somebody needs months
          # later when a crash report from this exact build arrives.
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$MAPPING" ]; then
            cp "$MAPPING" "release/mapping-$VERSION.txt"
            echo "mapping: $(wc -l < "$MAPPING") lines"
          else
            echo "::warning title=No mapping file::R8 produced no mapping.txt, so stack traces from this build will stay obfuscated."
          fi

          # Checksums cover everything now, not just the two installables: a
          # symbols zip nobody can verify is a symbols zip nobody should trust.
          (cd release && sha256sum ./*.aab ./*.apk ./*.zip ./*.txt 2>/dev/null \
            | grep -v SHA256SUMS | sed 's| \./| |' > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: arrowz-browser-${{ steps.artifacts.outputs.version }}
          path: release/

      # A workflow artifact expires and needs a GitHub login to fetch. A release
      # asset does neither, which is what "downloadable" has to mean.
      # No longer tag-only. The version is decided by the run now, so a run is a
      # release: it tags itself from the name it just derived. Without this the
      # date version would exist on Play with no tag behind it, and nothing in
      # git would say which commit shipped.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          # The section for this version, not whatever sits at the top of the
          # file: Unreleased is above it and says nothing. A date version has no
          # section, and falls through to the CHANGELOG pointer below.
          awk -v want="## [$VERSION]" \
            'index($0, want) == 1 { inside = 1; next } /^## \[/ { inside = 0 } inside' \
            CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

          {
            cat notes.md
            echo
            echo '## Checksums'
            echo
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
          } > body.md

          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Arrowz Browser $VERSION" \
            --notes-file body.md \
            release/arrowz-browser-*.aab \
            release/arrowz-browser-*.apk \
            release/native-debug-symbols-*.zip \
            release/mapping-*.txt \
            release/SHA256SUMS.txt

      # The secrets context is not available in a step-level if, so the check
      # has to become a step output. Using it directly makes GitHub reject the
      # whole workflow file, which shows up as a run with no jobs at all.
      # Loudly, because a green run that published nothing is the worst outcome
      # here. Skipping is legitimate -- a release can be cut for sideloading
      # alone -- so this warns rather than fails, but it warns where it cannot
      # be missed: an annotation on the run and a line in the job summary, not a
      # log line eleven steps deep that nobody scrolls to.
      - name: Is Play publishing configured
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Publishing ${{ steps.version.outputs.name }} to the internal track." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Nothing was published to Play::PLAY_SERVICE_ACCOUNT_JSON is not set, so this release built and attached its artifacts but never reached the Play Console. See docs/release.md."
            {
              echo '### Nothing was published to Play'
              echo
              echo 'The artifacts were built, signed, checksummed and attached to the release, and'
              echo 'the upload was skipped because `PLAY_SERVICE_ACCOUNT_JSON` is not set.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Publishing to the internal track only. Promotion to production stays a
      # manual decision in the Play Console, because a browser reaching every
      # Android TV device is not something a tag push should do on its own.
      # continue-on-error, because the artifacts are already built, signed and
      # attached by this point: a Play rejection must not retract a release
      # people can download. The commonest rejection is PERMISSION_DENIED on a
      # package Play has never heard of, which is what an app that has not been
      # created in the Console yet looks like from the API.
      - name: Publish to internal testing
        id: upload
        if: steps.play.outputs.configured == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nomercylabs.arrowz
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          # R8 is on, so without this every Java stack trace in the Play console
          # is obfuscated and a crash report is unreadable.
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          debugSymbols: ${{ steps.symbols.outputs.path }}
          track: internal
          status: completed

      - name: Did the Play upload land
        if: steps.play.outputs.configured == 'true'
        run: |
          if [ "${{ steps.upload.outcome }}" = "success" ]; then
            echo "Uploaded to the internal track." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning title=Play upload was rejected::The release itself is complete and its artifacts are attached. The upload to the internal track failed -- if this is PERMISSION_DENIED, com.nomercylabs.arrowz does not exist in the Play Console yet. See docs/release.md."
          {
            echo '### The Play upload was rejected'
            echo
            echo 'The artifacts were built, signed, checksummed and attached to the release.'
            echo 'Only the upload to the internal track failed, so nothing is lost -- see the'
            echo 'step log for the reason Play gave.'
          } >> "$GITHUB_STEP_SUMMARY"
