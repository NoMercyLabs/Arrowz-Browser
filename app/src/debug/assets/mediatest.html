<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arrowz Browser media test</title>
<style>
  body { background:#101014; color:#f2f2f5; font:28px/1.5 system-ui, sans-serif;
         margin:0; padding:64px; }
  .target { display:block; width:640px; height:280px; margin:32px 0;
            background:#7c3aed; color:#fff; border:0; border-radius:16px;
            font:600 32px system-ui, sans-serif; }
  #log { color:#9a9aa6; font-size:22px; }
</style>
<h1>Media test page</h1>
<button class="target" id="fs">Enter fullscreen</button>
<p id="log">not fullscreen</p>
<script>
  const box = document.getElementById('fs');
  const log = document.getElementById('log');
  box.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else box.requestFullscreen();
  });
  document.addEventListener('fullscreenchange', () => {
    log.textContent = document.fullscreenElement ? 'fullscreen' : 'not fullscreen';
  });
</script>
<h2>Audio</h2>
<button class="target" id="audio">Play a tone</button>
<script>
  // A real media element with real duration, generated in the page so the test
  // needs no bundled media file.
  function toneWav(seconds, freq) {
    const rate = 8000, n = rate * seconds, buf = new ArrayBuffer(44 + n * 2);
    const view = new DataView(buf);
    const put = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    put(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); put(8, 'WAVEfmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    put(36, 'data'); view.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      view.setInt16(44 + i * 2, Math.sin(2 * Math.PI * freq * i / rate) * 6000, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  const el = document.createElement('audio');
  el.src = toneWav(30, 220);
  el.controls = true;
  // Loops, because a fixture that stops after thirty seconds cannot outlast the
  // steps of a test that opens tabs between measurements.
  el.loop = true;
  document.body.appendChild(el);
  document.getElementById('audio').addEventListener('click', () => {
    if (el.paused) el.play(); else el.pause();
  });
  if (navigator.mediaSession) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'NoMercy test tone',
      artist: 'Media test page'
    });
  }
</script>
<h2>Renderer</h2>
<button class="target" id="crash">Exhaust the renderer</button>
<script>
  // Debug fixture. Allocates until the renderer is killed, which is the same
  // condition memory pressure produces on a 2GB box, and the only way to
  // exercise onRenderProcessGone without root.
  document.getElementById('crash').addEventListener('click', () => {
    const hog = [];
    for (;;) hog.push(new Array(2e6).fill(Math.random()));
  });
</script>
